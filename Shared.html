<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --panel:#ffffff; --ink:#33302a; --muted:#8b8577;
    --border:#e7e1d4; --accent:#8fa998; --accent-dark:#5f7c6c;
    --guide-bg:#efe6f5; --guide-ink:#5b3f75; --guide-sel:#c9aee0;
    --orig-bg:#fbe9d6; --orig-ink:#7a4a1c; --orig-sel:#f0bd7e;
    --green:#4c9a72; --green-bg:#e7f5ec; --red:#d95f52; --red-bg:#fbeae7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
  .lit{font-family:'Noto Serif KR','Malgun Gothic',serif;white-space:pre-wrap;line-height:2;font-size:clamp(15px,1.6vw,18px);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(60,50,30,.05);}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;}
  .btn:active{background:var(--accent-dark);}
  .btn.ghost{background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent);}
  .btn.danger{background:var(--red);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .kw{display:inline-block;border-radius:7px;padding:1px 5px;margin:0 1px;cursor:pointer;
    transition:transform .12s, background .15s;}
  .kw-left{background:var(--guide-bg);color:var(--guide-ink);}
  .kw-right{background:var(--orig-bg);color:var(--orig-ink);}
  .kw.selected{outline:2.5px solid var(--accent-dark);transform:scale(1.05);}
  .kw.solved{cursor:default;background:var(--green-bg);color:var(--green);font-weight:700;}
  .kw.shake{animation:kwshake .4s;}
  @keyframes kwshake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-4px)}
    40%{transform:translateX(4px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(3px)}
  }

  .mapper{position:relative;}
  .mapper .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:720px){ .mapper .cols{grid-template-columns:1fr;} }
  .line-layer{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
</style>
<script>
/* 텍스트 안에서 keywords 배열의 각 문구를(첫 등장만) <span class="kw">로 감싸 렌더링.
   같은 위치에서 여러 후보가 겹치면 더 긴 문구를 우선 매칭한다. */
function renderHighlighted(container, text, keywords, side) {
  container.innerHTML = '';
  const kws = keywords.filter(Boolean).slice().sort((a, b) => b.length - a.length);
  const used = new Set();
  const map = {};
  const frag = document.createDocumentFragment();
  let buf = '';
  const flush = () => { if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ''; } };
  let i = 0;
  while (i < text.length) {
    let matched = null;
    for (const k of kws) {
      if (used.has(k)) continue;
      if (text.startsWith(k, i)) { matched = k; break; }
    }
    if (matched) {
      flush();
      const span = document.createElement('span');
      span.className = 'kw kw-' + side;
      span.textContent = matched;
      span.dataset.side = side;
      span.dataset.kw = matched;
      frag.appendChild(span);
      map[matched] = span;
      used.add(matched);
      i += matched.length;
    } else {
      buf += text[i];
      i += 1;
    }
  }
  flush();
  container.appendChild(frag);
  return map;
}

/* root(position:relative인 컨테이너) 위에 두 지점을 잇는 곡선을 그리는 SVG 오버레이 */
function createLineLayer(root) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'line-layer');
  root.appendChild(svg);
  const lines = new Map();

  function pt(el, side) {
    const r = el.getBoundingClientRect();
    const rr = root.getBoundingClientRect();
    return { x: (side === 'left' ? r.right : r.left) - rr.left, y: r.top + r.height / 2 - rr.top };
  }
  function size() {
    svg.setAttribute('width', root.scrollWidth);
    svg.setAttribute('height', root.scrollHeight);
  }
  function draw(L) {
    const p1 = pt(L.a, 'left'), p2 = pt(L.b, 'right');
    const mx = (p1.x + p2.x) / 2;
    L.path.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' C ' + mx + ' ' + p1.y + ', ' + mx + ' ' + p2.y + ', ' + p2.x + ' ' + p2.y);
    L.path.setAttribute('stroke', L.color);
  }
  function redrawAll() { size(); lines.forEach(draw); }

  function addLine(key, elA, elB, color) {
    let L = lines.get(key);
    if (!L) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-width', '3');
      path.setAttribute('stroke-linecap', 'round');
      svg.appendChild(path);
      L = { a: elA, b: elB, color, path };
      lines.set(key, L);
    } else { L.color = color; }
    size();
    draw(L);
    return L;
  }
  function removeLine(key) {
    const L = lines.get(key);
    if (L) { L.path.remove(); lines.delete(key); }
  }
  function clear() { lines.forEach(L => L.path.remove()); lines.clear(); }

  window.addEventListener('resize', redrawAll);
  return { addLine, removeLine, clear, redrawAll };
}

/* 좌측 칩 클릭 → 우측 칩 클릭 순서로 완성되는 클릭-클릭 연결 상호작용 */
function enablePairing(leftMap, rightMap, onAttempt) {
  let selected = null;
  Object.values(leftMap).forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('solved')) return;
      if (selected) selected.el.classList.remove('selected');
      selected = { kw: el.dataset.kw, el };
      el.classList.add('selected');
    });
  });
  Object.values(rightMap).forEach(el => {
    el.addEventListener('click', () => {
      if (!selected || el.classList.contains('solved')) return;
      const gKw = selected.kw, gEl = selected.el;
      gEl.classList.remove('selected');
      selected = null;
      onAttempt(gKw, gEl, el.dataset.kw, el);
    });
  });
}

/* renderHighlighted의 최장일치 스캔이 깨지지 않았는지 확인하는 자가진단.
   ?selftest=1 로 접속했을 때만 실행되어 평소 로딩에는 영향이 없다. */
function runSelfTest_() {
  const div = document.createElement('div');
  const map = renderHighlighted(div, '매화나 보내고져 매화', ['매화', '매화나'], 'left');
  console.assert(map['매화나'] && map['매화'], 'selftest: 두 키워드 모두 매칭돼야 함');
  console.assert(div.querySelectorAll('.kw').length === 2, 'selftest: 칩 2개(각 문구 첫 등장만)여야 함');
  console.log('renderHighlighted 자가진단 통과');
}
if (new URLSearchParams(location.search).get('selftest') === '1') {
  document.addEventListener('DOMContentLoaded', runSelfTest_);
}
</script>
